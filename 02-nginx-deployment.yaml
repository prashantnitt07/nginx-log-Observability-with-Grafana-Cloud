apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-poc
  namespace: poc

spec:

  replicas: 2

  selector:
    matchLabels:
      app: nginx-poc

  template:

    metadata:
      labels:
        app: nginx-poc

    spec:

      containers:

        - name: nginx

          image: nginx:1.27-alpine

          ports:
            - containerPort: 80

          volumeMounts:

            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:

        - name: nginx-config

          configMap:
            name: nginx-config